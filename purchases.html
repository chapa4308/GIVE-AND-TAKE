<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title="brand.name">Give And Take — Purchases</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body data-page="purchases">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand" data-t="brand.name">GIVE AND TAKE</div>
        <nav class="nav">
          <a href="./home.html" data-nav="home"><span class="left"><span class="icon">🏠</span> <span data-t="nav.home">Главная</span></span></a>
          <a href="./cards-wallets.html" data-nav="cardsWallets"><span class="left"><span class="icon">💳</span> <span data-t="nav.cardsWallets">Карты и кошельки</span></span></a>
          <a href="./settings.html" data-nav="settings"><span class="left"><span class="icon">⚙️</span> <span data-t="nav.settings">Настройки</span></span></a>
          <a href="./analytics.html" data-nav="analytics"><span class="left"><span class="icon">📈</span> <span data-t="nav.analytics">Аналитика</span></span></a>
          <a href="./sales.html" data-nav="sales"><span class="left"><span class="icon">🧾</span> <span data-t="nav.sales">Продажи</span></span></a>
          <a href="./purchases.html" data-nav="purchases" class="active"><span class="left"><span class="icon">🛒</span> <span data-t="nav.purchases">Купля</span></span></a>
          <a href="./balance.html" data-nav="balance"><span class="left"><span class="icon">💰</span> <span data-t="nav.balance">Баланс</span></span></a>
          <a href="./messages.html" data-nav="messages"><span class="left"><span class="icon">💬</span> <span data-t="nav.messages">История переписки</span></span></a>
          <a href="./disputes.html" data-nav="disputes"><span class="left"><span class="icon">❗</span> <span data-t="nav.disputes">Диспуты</span></span></a>
        </nav>
      </aside>

      <main class="content">
        <header class="topbar">
          <div class="muted"><span data-t="topbar.balanceLabel">Баланс</span>: <b style="color:#1e63ff">0.00 USDT</b></div>
          <div class="right">
            <div class="muted" data-user></div>
            <button class="logout" data-logout data-t="topbar.logout">Logout</button>
          </div>
        </header>

        <section class="page">
          <div class="card" style="padding:16px; max-width:520px">
            <div style="font-weight:900; margin-bottom:10px" data-t="pages.purchases.tableDate">Дата для таблицы</div>
            <input class="input" placeholder="dd.mm.yyyy" />
          </div>

          <div class="tabs" style="margin-top:14px">
            <button class="tab active">ВСЕ</button>
            <button class="tab">НОВЫЕ ЗАЯВКИ</button>
            <button class="tab">ОЖИДАЮТ ПРОВЕРКИ</button>
            <button class="tab">ЗАВЕРШЕННЫЕ</button>
            <button class="tab">СПОР</button>
            <button class="tab">ОТМЕНЕННЫЕ</button>
          </div>

          <div style="margin-top:12px">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>ДАТА И ВРЕМЯ</th>
                  <th>ДЕТАЛИ</th>
                  <th>СТАТУС</th>
                  <th>СУММА</th>
                  <th>ВАЛЮТА</th>
                  <th>КУРС/МОЙ КУРС</th>
                  <th>БОНУС СДЕЛКИ %</th>
                  <th>ДЕЙСТВИЕ</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="9" class="muted" style="text-align:center; padding:28px">No data</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      import { applyContent, requireAuth, setUserBadge, setActiveNav, wireLogout } from './assets/app.js';
      await applyContent();
      requireAuth();
      setUserBadge();
      setActiveNav();
      wireLogout();
    </script>
  </body>
</html>
